                                - text: Vous êtes bilingues ? Vous pourriez traduire des descriptions de jeux. Vous êtes spécialiste d’une plateforme ? Vous pourriez vérifier l’exactitude des données de ScreenScraper ou encore associer des roms orphelines à un jeu. Vous êtes infographiste ? Vous pourriez créer les logos des jeux manquants ou encore reproduire, retoucher ou assembler des textures de boîtiers ou de supports. Vous êtes collectionneur ? Vous pourriez scanner les jaquettes de boîtier ou les étiquettes de cartouche de jeu. Vous êtes joueur ? Vous pourriez capturer une petite vidéo de présentation d’un jeu sans vidéo. Nous avons besoin de toutes les bonnes volontés pour nous aider à remplir la base de données & de médias ScreenScraper.
                                - generic [ref=f18e977]: Ensemble, nous y arriverons !
                                - text: Alors si vous voulez que le front-end soit le plus beau et complet possible, rendez-vous sur la page des
                                - link "chantiers en cours" [ref=f18e978] [cursor=pointer]:
                                  - /url: chantiers.php
                                - text: pour trouver comment nous aider.

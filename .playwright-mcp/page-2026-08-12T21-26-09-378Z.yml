                  - rowgroup [ref=f32e443]:
                    - row [ref=f32e444]:
                      - cell [ref=f32e445]:
                        - text: "Paramètres d'entrées : devid : votre identifiant développeur devpassword : votre mot de passe développeur softname : nom du logiciel appelant output : xml(par defaut),json"
                        - separator [ref=f32e446]
                        - text: "Item :"
                        - generic [ref=f32e447]: serveurs
                        - text: "(informations serveurs ScreenScraper) Elements Retournés : cpu1 : % d'utilisation du CPU du serveur 1 (moyenne des 5 dernières minutes) cpu2 : % d'utilisation du CPU du serveur 2 (moyenne des 5 dernières minutes) cpu3 : % d'utilisation du CPU du serveur 3 (moyenne des 5 dernières minutes) threadsmin : Nombre d'accés a l'api depuis la dernière minute nbscrapeurs : Nombre de scrapeurs utilisant l'api depuis la dernière minute apiacces : Nombre d'accés a l'api dans la journée en cours (GMT+1) Status closefornomember : API fermée pour les anonymes (non inscrits ou non identifiés) (0 : ouvert / 1 : fermé) closeforleecher : API fermée pour les membres non participant (aucune proposition validé) (0 : ouvert / 1 : fermé) Quota maxthreadfornonmember : Nombre maximum de threads ouverts pour les anonymes (non inscrits ou non identifiés) en même temps par l'api threadfornonmember : Nombre actuel de threads ouverts par les anonymes (non inscrits ou non identifiés) en même temps par l'api maxthreadformember : Nombre maximum de threads ouverts pour les membres en même temps par l'api threadformember : Nombre actuel de threads ouverts par les membres en même temps par l'api"
                        - separator [ref=f32e448]
                        - text: Exemple d'appel
                        - link "https://api.screenscraper.fr/api2/ssinfraInfos.php?devid=xxx&devpassword=yyy&softname=zzz&output=xml" [ref=f32e449] [cursor=pointer]:
                          - /url: https://api.screenscraper.fr/api2/ssinfraInfos.php?devid=xxx&devpassword=yyy&softname=zzz&output=xml
                - generic [ref=f32e450]: "ssuserInfos.php : Informations sur l'utilisateur ScreenScraper"
                - table [ref=f32e452]:
                  - rowgroup [ref=f32e453]:
                    - row [ref=f32e454]:
                      - cell [ref=f32e455]:
                        - text: "Paramètres d'entrées : devid : votre identifiant développeur devpassword : votre mot de passe développeur softname : nom du logiciel appelant output : xml(par defaut),json ssid : identifiant ScreenScraper de l'utilisateur sspassword : Mot de passe ScreenScraper de l'utilisateur"
                        - separator [ref=f32e456]
                        - text: "Item :"
                        - generic [ref=f32e457]: ssuser
                        - text: "(informations utilisateurs ScreenScraper) Elements Retournés : id : pseudo de l'utilisateur sur ScreenScraper numid : identifiant numérique de l'utilisateur sur ScreenScraper niveau : niveau de l'utilisateur sur ScreenScraper contribution : niveau de contribution financière sur ScreenScraper (2 = 1 Thread Supplémentaire / 3 et + = 5 Threads Supplémentaires) uploadsysteme : Compteur de contributions valides (média de système) proposés par l'utilisateur uploadinfos : Compteur de contributions valides (infos texte) proposés par l'utilisateur romasso : Compteur de contributions valides (association de rom) proposés par l'utilisateur uploadmedia : Compteur de contributions valides (média de jeu) proposés par l'utilisateur propositionok : Nombre de propositions de l'utilisateur validées par un modérateur propositionko : Nombre de propositions de l'utilisateur refusées par un modérateur quotarefu : Pourcentage de refu de proposition de l'utilisateur Threads maxthreads : Nombre de threads autorisés pour l'utilisateur (également indiqué pour les non-inscrits) maxdownloadspeed : Vitesse de téléchargement (en Ko/s) autorisée pour l'utilisateur (également indiqué pour les non-inscrits) Quotas requeststoday : Nombre d'appel total a l'api pendant la journée en court requestskotoday : Nombre d'appel a l'api avec un retour négatif (rom/jeu non trouvé) pendant la journée en court maxrequestspermin : Nombre d'appel a l'api maximum autorisé par minute pour l'utilisateur (voir F.A.Q.) maxrequestsperday : Nombre d'appel a l'api maximum autorisé par jour pour l'utilisateur (voir F.A.Q.) maxrequestskoperday : Nombre d'appel a l'api avec un retour négatif (rom/jeu non trouvé) maximum autorisé par jour pour l'utilisateur (voir F.A.Q.) visites : nombre de visites de l'utilisateur sur ScreenScraper datedernierevisite : date de la dernière visite de l'utilisateur sur ScreenScraper (format : yyyy-mm-jj hh:mm:ss) favregion : région favorite de visites de l'utilisateur sur ScreenScraper (france,europe,usa,japon)"
                        - separator [ref=f32e458]
                        - text: Exemple d'appel
                        - link "https://api.screenscraper.fr/api2/ssuserInfos.php?devid=xxx&devpassword=yyy&softname=zzz&output=xml&ssid=mataderos14&sspassword=1423154" [ref=f32e459] [cursor=pointer]:
                          - /url: https://api.screenscraper.fr/api2/ssuserInfos.php?devid=xxx&devpassword=yyy&softname=zzz&output=xml&ssid=mataderos14&sspassword=1423154

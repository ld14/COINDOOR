                        - cell "Are you bilingual? Translate game descriptions! Are you a platform specialist? Check the accuracy of ScreenScraper's data or associate orphaned ROMs to a game! Are you a graphic designer? Create the logos of missing games, and reproduce, touch up, or create box art! Are you a collector? Scan your box cover or cartridge labels! Are you a gamer? Capture video for a game that doesn't have any! We need all the help we can get to complete ScreenScraper's database and media. Together, we can do it! So if you want your frontend to be as beautiful and as complete as possible, register now" [ref=f15e443]:

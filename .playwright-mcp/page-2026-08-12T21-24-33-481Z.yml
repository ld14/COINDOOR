                                - 'cell "To make sure everything goes smoothly, follow these steps... 1. Create your screenscraper account 2. Make your donation on one of the donation platforms 3. Log in to the ScreenScraper website and then go to your ScreenScraper member account page (click on your username at the top of the page). You can then link your Patreon or Tipeee account to your ScreenScraper account. 4. If after 24 hours your account has not been updated, contact us on our discord and follow the instructions available on the pinned topics of the #support room." [ref=f15e421]'

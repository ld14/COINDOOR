                        - separator [ref=f32e626]
                        - text: "Item :"
                        - generic [ref=f32e627]: ssuser
                        - text: "(informations utilisateurs ScreenScraper) Elements Retournés : id : pseudo de l'utilisateur sur ScreenScraper niveau : niveau de l'utilisateur sur ScreenScraper contribution : niveau de contribution financière sur ScreenScraper (2 = 1 Thread Supplémentaire/3 et + = 5 Threads Supplémentaires) uploadsysteme : Compteur de contributions valides (média de système) proposés par l'utilisateur uploadinfos : Compteur de contributions valides (infos texte) proposés par l'utilisateur romasso : Compteur de contributions valides (association de rom) proposés par l'utilisateur uploadmedia : Compteur de contributions valides (média de jeu) proposés par l'utilisateur maxthreads : Nombre de threads autorisés pour l'utilisateur (également indiqué pour les non-inscrits) maxdownloadspeed : Vitesse de téléchargement (en Ko/s) autorisée pour l'utilisateur (également indiqué pour les non-inscrits) requeststoday : Nombre d'appel a l'api pendant la journée en court requestskotoday : Nombre d'appel a l'api avec un retour négatif (rom/jeu non trouvé) pendant la journée en court maxrequestsperdmin : Nombre d'appel a l'api maximum autorisé par minute pour l'utilisateur (voir F.A.Q.) maxrequestsperday : Nombre d'appel a l'api maximum autorisé par jour pour l'utilisateur (voir F.A.Q.) maxrequestskoperday : Nombre d'appel a l'api avec un retour négatif (rom/jeu non trouvé) maximum autorisé par jour pour l'utilisateur (voir F.A.Q.) visites : nombre de visites de l'utilisateur sur ScreenScraper datedernierevisite : date de la dernière visite de l'utilisateur sur ScreenScraper (format : yyyy-mm-jj hh:mm:ss) favregion : région favorite de visites de l'utilisateur sur ScreenScraper (france,europe,usa,japon)"
                        - separator [ref=f32e628]
                        - text: "Items :"
                        - generic [ref=f32e629]: systeme
                        - text: (xml) /
                        - generic [ref=f32e630]: systemes
                        - text: "(json) Elements Retournés : id : identifiant numérique du système (à refournir dans les autres requêtes de l’api) parentid : identifiant numérique du système parent noms { nom_xx : Nom du système Région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) ... nom_recalbox : Nom du système dans le front-end Recalbox nom_retropie : Nom du système dans le front-end Retropie nom_launchbox : Nom du système dans le front-end Launchbox nom_hyperspin : Nom du système dans le front-end Hyperspin noms_commun : Noms commun donnée au système en général } extensions : extensions des fichiers de roms utilisables (tous emulateurs confondus) compagnie : Nom de la société de production du système type : Type de système (Arcade,Console,Console Portable,Emulation Arcade,Flipper,Online,Ordinateur,Smartphone) datedebut : Année de début de production datefin : Année de fin de production romtype : Type(s) de roms (voir requête romTypesListe) supporttype : Type du ou des supports d’origines du système (voir requête supportTypesListe) medias { media_logosmonochrome { media_logomonochrome_xx : url de téléchargement du média : Logo Monochrome région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) media_logomonochrome_xx_crc : identifiant CRC32 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_logomonochrome_xx_md5 : identifiant md5 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_logomonochrome_xx_sha1 : identifiant sha1 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) ... } media_wheels { media_wheel_xx : url de téléchargement du média : Logo Couleur région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) media_wheel_xx_crc : identifiant CRC32 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_wheel_xx_md5 : identifiant md5 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_wheel_xx_sha1 : identifiant sha1 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) ... } media_wheelscarbon { media_wheelcarbon_xx : url de téléchargement du média : Wheel Carbon région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) media_wheelcarbon_xx_crc : identifiant CRC32 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_wheelcarbon_xx_md5 : identifiant md5 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_wheelcarbon_xx_sha1 : identifiant sha1 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) ... } media_wheelscarbonvierge { media_wheelcarbonvierge_xx : url de téléchargement du média : Wheel Carbon vierge région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) media_wheelcarbonvierge_xx_crc : identifiant CRC32 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_wheelcarbonvierge_xx_md5 : identifiant md5 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_wheelcarbonvierge_xx_sha1 : identifiant sha1 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) ... } media_wheelssteel { media_wheelsteel_xx : url de téléchargement du média : Wheel Steel région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) media_wheelsteel_xx_crc : identifiant CRC32 du fichier média (vous permet de checker si le média en ligne et le même qu'en local avant de la télécharger) media_wheelsteel_xx_md5 : identifiant md5 du fichier média (vous permet de checker si le média en li
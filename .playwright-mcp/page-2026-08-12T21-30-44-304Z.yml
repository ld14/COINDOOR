                                  - generic [ref=f57e1]:
                                    - generic [ref=f57e2]: Hi, I'm building COINDOOR, a self-hosted, single-user tool that prepares game metadata (identity, artwork, synopsis) for a personal retro arcade cabinet running Pegasus. Open source, non-commercial, personal use only.
                                    - generic [ref=f57e3]: I'd like to request devid/devpassword to use the API — mainly for identifying console ROMs by hash (CRC32/MD5/SHA1) and fetching box art, screenshots and video.
                                    - generic [ref=f57e4]: My ScreenScraper username is mataderos14.
                                    - generic [ref=f57e5]: "Software name: COINDOOR"
                                    - generic [ref=f57e6]: "Purpose: personal retro-gaming cabinet metadata management"
                                    - generic [ref=f57e7]: "Usage: single user, one game at a time, no bulk scraping"
                                    - generic [ref=f57e8]: Thanks!

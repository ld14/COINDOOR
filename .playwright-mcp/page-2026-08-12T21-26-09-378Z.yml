 rom ou du dossier romsize : taille en octect du fichier rom ou taille du contenu du dossier romcrc : résultat du calcul CRC32 du fichier rom ou du fichier le plus gros du dossier \"rom\" rommd5 : résultat du calcul MD5 du fichier rom ou du fichier le plus gros du dossier \"rom\" romsha1 : résultat du calcul SHA1 du fichier rom ou du fichier le plus gros du dossier \"rom\" romcloneof : identifiant numérique de la rom parent si la rom est un clone (Systèmes Arcade) beta : Version Beta du jeu (0=non / 1=oui) demo : Version Demo du jeu (0=non / 1=oui) trad : Version Traduite du jeu (0=non / 1=oui) hack : Version Modifiée du jeu (0=non / 1=oui) unl : Jeu non \"Officiel\" (0=non / 1=oui) alt : Version Alternative du jeu (0=non / 1=oui) best : Meilleur Version du jeu (0=non / 1=oui) retroachievement : Compatible Retro Achievement (0=non / 1=oui) gamelink : Compatible Gamelink (0=non / 1=oui) nbscrap : Nombre de fois total scrapée ] rom { Informations sur la rom scrapé (si trouvé dans la base de données) rom (xml) / romid (json) { id : identifiant numérique de la rom romnumsupport : numero de support (ex : 1 = disquette 01 ou CD 01) romtotalsupport : nombre total de support (ex : 2 = 2 disquettes ou 2 CDs) romfilename : nom du ficher rom ou du dossier romserial : numero de série du fabriquant romregions : region(s) de la rom ou du dossier (ex : \"fr,us,sp\" ) romlangues : langue(s) de la rom ou du dossier (ex : \"fr,en,es\" ) romtype : type de rom romsupporttype : type de support romsize : taille en octect du fichier rom ou taille du contenu du dossier romcrc : résultat du calcul CRC32 du fichier rom ou du fichier le plus gros du dossier \"rom\" rommd5 : résultat du calcul MD5 du fichier rom ou du fichier le plus gros du dossier \"rom\" romsha1 : résultat du calcul SHA1 du fichier rom ou du fichier le plus gros du dossier \"rom\" romcloneof : identifiant numérique de la rom parent si la rom est un clone (Systèmes Arcade) beta : Version Beta du jeu (0=non / 1=oui) demo : Version Demo du jeu (0=non / 1=oui) trad : Version Traduite du jeu (0=non / 1=oui) hack : Version Modifiée du jeu (0=non / 1=oui) unl : Jeu non \"Officiel\" (0=non / 1=oui) alt : Version Alternative du jeu (0=non / 1=oui) best : Meilleur Version du jeu (0=non / 1=oui) retroachievement : Compatible Retro Achievement (0=non / 1=oui) gamelink : Compatible Gamelink (0=non / 1=oui) nbscrap : Nombre de fois total scrapée joueurs : Nombre de joueurs spécifique a la rom (si différente du jeu \"d'origine\") dates { id texte region (france=date_fr,europe=date_eu,usa=date_us,japon=date_jp,...) : Date de sortie spécifique a la rom (si différente du jeu \"d'origine\") dans la région indiquées } editeur : Nom de l'editeur spécifique a la rom (si différente du jeu \"d'origine\") developpeur : Nom du developpeur spécifique a la rom (si différente du jeu \"d'origine\") synopsis { synopsis_xx : Description spécifique a la rom (si différente du jeu \"d'origine\") en langue xx (xx = variable \"nomcourt\" de l'API languesListe.php) ... } clonetypes { clonetypes_id : identifiant numérique du type de clone clonetypes_xx : désignation du type de hack région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) ... } hacktypes { hacktypes_id : identifiant numérique du type de hack hacktypes_xx : désignation du type de hack région xx (xx = variable \"nomcourt\" de l'API regionsListe.php) ... } } }"

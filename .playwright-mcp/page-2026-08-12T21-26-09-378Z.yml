                        - text: "Paramètres : devid : votre identifiant développeur devpassword : votre mot de passe développeur softname : nom du logiciel appelant ssid : identifiant ScreenScraper de l'utilisateur (optionel) sspassword : Mot de passe ScreenScraper de l'utilisateur (optionel) crc : calcul crc du fichier manuel existant en local md5 : calcul md5 du fichier manuel existant en local sha1 : calcul sha1 du fichier manuel existant en local systemeid : identifiant numérique du système (voir systemesListe.php) jeuid : identifiant numérique du système (voir jeuInfos.php) media : identifiant texte du média à retourner (voir jeuInfos.php) mediaformat : format (extension) du media : ex : jpg, png, mp4, zip, mp3, pdf, ... (non obligatoire, donnée informative : ne retourne pas le média au format spécifié)"
                        - separator [ref=f32e738]
                        - text: "Element Retourné :"
                        - generic [ref=f32e739]: Manuel PDF
                        - text: ou Texte CRCOK ou MD5OK ou SHA1OK si le paramètres crc, md5 ou sha1 est identique au calcul crc, md5 ou sha1 de la vidéo du serveur (optimisation des mises à jour) ou Texte NOMEDIA si le fichier média n'a pas été trouvé
                        - separator [ref=f32e740]
                        - text: Exemple d'appel
                        - link "https://api.screenscraper.fr/api2/mediaManuelJeu.php?devid=xxx&devpassword=yyy&softname=zzz&ssid=test&sspassword=test&crc=&md5=&sha1=&systemeid=1&jeuid=3&media=manuel(eu)" [ref=f32e741] [cursor=pointer]:
                          - /url: https://api.screenscraper.fr/api2/mediaManuelJeu.php?devid=xxx&devpassword=yyy&softname=zzz&ssid=test&sspassword=test&crc=&md5=&sha1=&systemeid=1&jeuid=3&media=manuel(eu)
                - generic [ref=f32e742]: "botNote.php : Système pour l'automatisation d'envoi de note de jeu d'un membre ScreenScraper"
                - table [ref=f32e744]:
                  - rowgroup [ref=f32e745]:
                    - row [ref=f32e746]:
                      - cell [ref=f32e747]:
                        - text: "La requête doit être envoyée sous forme d'une requête html avec la methode \"GET\". Paramètres : ssid : (type \"text\") identifiant ScreenScraper de l'utilisateur sspassword : (type \"text\") Mot de passe ScreenScraper de l'utilisateur gameid : (type \"text\") identifiant numérique du jeu sur ScreenScraper note : (type \"nombre entier de 1 a 20\") Note sur 20 du jeu Element Retourné : Renvoi une information textuelle sur le bon ou mauvais fonctionnement de la procédure"
                        - separator [ref=f32e748]
                        - text: Exemple d'appel
                        - link "https://api.screenscraper.fr/api2/botNote.php?devid=xxx&devpassword=yyy&softname=zzz&ssid=test&sspassword=test&gameid=3&note=18" [ref=f32e749] [cursor=pointer]:
                          - /url: https://api.screenscraper.fr/api2/botNote.php?devid=xxx&devpassword=yyy&softname=zzz&ssid=test&sspassword=test&gameid=3&note=18
                - generic [ref=f32e750]: "botProposition.php : Système pour automatisation d'envoi de propositions d'infos ou de médias a ScreenScraper"
                - table [ref=f32e752]:
                  - rowgroup [ref=f32e753]:
                    - row [ref=f32e754]:
                      - cell [ref=f32e755]:
                        - text: "La requête doit être envoyée sous forme d'un formulaire html de type \"multipart/form-data\" avec la methode \"POST\". Paramètres d'entrées : ssid : (type \"text\") identifiant ScreenScraper de l'utilisateur sspassword : (type \"text\") Mot de passe ScreenScraper de l'utilisateur gameid : (type \"text\") identifiant numérique du jeu sur ScreenScraper ou romid : (type \"text\") identifiant numérique de la rom sur ScreenScraper Pour proposer une info textuelle : modiftypeinfo : (type \"text\") type d'info envoyé (voir liste \"modiftypeinfo\") modifregion : (type \"text\") nom court de la region de l'information (optionel: voir liste \"modiftypeinfo\" / liste des régions \"regionsListe.php\") modiflangue : (type \"text\") nom court de la langue de l'information (optionel: voir liste \"modiftypeinfo\" / liste des régions \"languesListe.php\") modifversion : (type \"text\") version de l'information (optionel: voir liste \"modiftypeinfo\") modiftexte : (type \"text\") Information proprement dite modifsource : (type \"text\") (optionel) Source (url de la page internet, scan du support original, auteur, ...) de l'information Exemple de formulaire html :"
                        - code [ref=f32e756]:
                          - generic [ref=f32e757]: <html> <head> <META http-equiv="Content-Type" content="text/html; charset=UTF-8"> <META http-equiv="content-language" content="fr"> <title></title> </head> <body> <form name="myform" id="myform" method="post" enctype="multipart/form-data" action="https://api.screenscraper.fr/api2/botProposition.php?ssid=xxx&sspassword=yyy"> <input type="text" name="gameid" value="3"> <input type="text" name="modiftypeinfo" value="description"> <input type="text" name="modifregion" value=""> <input type="text" name="modiflangue" value="fr"> <input type="text" name="modifversion" value=""> <input type="text" name="modiftexte" value="ici, le synopsis du jeu ! ne pas valider, c'est un test ;)"> <input type="text" name="modifsource" value="botProposition / source de l'info"> <input type="submit" value="envoyer"> </form> <script> document.getElementById("myform").submit(); </script> </body> </html>
                        - text: "Pour proposer un média : modiftypemedia : (type \"text\") type de média envoyé (voir liste \"modiftypemedia\") modifmediafile : (type \"file\") Fichier (Format du fichier : voir liste \"modiftypemedia\") modifmediafileurl : (type \"text\") url du média a télécharger (Format du fichier : voir liste \"modiftypemedia\") modiftyperegion : (type \"text\") nom court de la region de l'information (optionel: voir liste \"modiftypemedia\" / liste des régions \"regionsListe.php\") modiftypenumsupport : (type \"text\") numero de support (optionel: voir liste \"modiftypemedia\" / numéro de 0 a 10) modiftypeversion : (type \"text\") version de l'information (optionel: voir liste \"modiftypemedia\") modifmediasource : (type \"text\") (optionel) Source (url de la page internet, scan du support original, auteur, ...) de l'information Elements Retournés : Renvoi une information textuelle sur le bon ou mauvais fonctionnement de la procédure"

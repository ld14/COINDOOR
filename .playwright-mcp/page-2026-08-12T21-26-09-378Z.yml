                - generic [ref=f32e308]: Présentation de l'API
                - table [ref=f32e310]:
                  - rowgroup [ref=f32e311]:
                    - row [ref=f32e312]:
                      - cell [ref=f32e313]:
                        - generic [ref=f32e314]:
                          - text: "Attention : la version 2 est en mode betatest, des modifications peuvent etre apportées a tout moment sur cette version de l'API sans préavis. Notre API vous permet d’obtenir l'intégralité des données et des médias de ScreenScraper pour l'intégrer dans vos applications : front-ends, utilitaires. Toutes nos requêtes permettent d’obtenir en retour les informations voulues au format XML, JSON ou ini. Qui peut utiliser l'API ?"
                          - generic [ref=f32e315]: L'API ScreenScraper ne peut être intégré que dans les applications entièrement gratuites et distribuées, ou, dans le cas contraire, avec l'autorisation préalable et les conditions dictées par l'équipe de ScreenScraper.
                          - text: Tout manquement à cette règle pourra faire l’objet d’une coupure de compte, voir d’éventuelles poursuites judiciaires ! Si vous êtes développeur et voulez intégrer notre API,
                          - link "contactez-nous via le forum" [ref=f32e316] [cursor=pointer]:
                            - /url: https://www.screenscraper.fr/forumsujets.php?frub=12&numpage=0
                          - text: "pour présenter votre logiciel et obtenir vos identifiants et mot de passe à fournir à l’API pour valider vos droits d’exploitation de celle-ci Comment faire des requêtes a notre API ? Les demandes d’informations et/ou média à l'API ScreenScraper sont effectuées par l’appel de requêtes URL de type GET et un document XML ou json est retourné. Exemple Jeu Recherche:"
                          - link "https://api.screenscraper.fr/api2/jeuInfos.php?devid=xxx&devpassword=yyy&softname=zzz&ssid=test&sspassword=test&output=xml&crc=50ABC90A&systemeid=1&romtype=rom&romnom=Sonic%20The%20Hedgehog%202%20(World).zip&romtaille=749652" [ref=f32e317] [cursor=pointer]:
                            - /url: https://api.screenscraper.fr/api2/jeuInfos.php?devid=xxx&devpassword=yyy&softname=zzz&output=xml&ssid=test&sspassword=test&crc=50ABC90A&systemeid=1&romtype=rom&romnom=Sonic%20The%20Hedgehog%202%20(World).zip&romtaille=749652
                - generic [ref=f32e318]: Combien de requêtes simultanés a l'API est autorisé ?
                - table [ref=f32e320]:
                  - rowgroup [ref=f32e321]:
                    - row [ref=f32e322]:
                      - cell [ref=f32e323]:
                        - text: En fonction du niveau de contribution de l'utilisateur (à la base de données ou financière) celui-ci se fait attribuer des ouvertures de « Threads ».
                        - strong [ref=f32e324]: Qu’est-ce qu’un « Thread » ?
                        - text: Certains logiciels de scrape, comme « Universal XML Scraper » vous permette de gagner du ‘temps de scrape’ en ne traitant pas les roms une par une, mais simultanément en parallèle. Le nombre de scrape simultané est ce que l’on appelle un « Thread ». Donc avec 4 Threads, vous scrapez vos roms 4 par 4, ce qui représente un gain de temps énorme. Par contre, cela sollicite beaucoup plus votre ordinateur et votre bande passante (il faut donc que celui-ci ai les ressources nécessaires) mais surtout, sollicite beaucoup plus la base de données et le serveur qui l’héberge. C’est pour cela que le système de « récompense » a été mis en place. Pour vous remercier de contribuer à la vie de la base de données Screenscraper on vous offre la possibilité de puiser dans ses ressources plus efficacement.
                        - strong [ref=f32e325]: Comment gagner des « Threads » ?
                        - text: "Il existe 2 méthodes simples : - Participer à la base de données en proposant de nouvelles informations ou de nouveaux medias - Participer financièrement à l’hébergement de la base de données via Tipee ou Patreon."
                        - strong [ref=f32e326]: Combien puis-je gagner de « Threads » ?
                        - text: Consulter la
                        - link "F.A.Q" [ref=f32e327] [cursor=pointer]:
                          - /url: faq.php
                        - text: pour plus d'informations
                - generic [ref=f32e328]: Combien de requêtes a l'API est autorisé par minute et par jour ?
                - generic [ref=f32e329]:
                  - text: Depuis environ le milieu de l'année 2019, un système de « Quota » a été intégré a l'API afin d'éviter la saturation de nos serveurs. Le principe est de limiter le droit d'accés a l'API pour chaque utilisateur par minute et par jour en fonction de leur niveau et leur participation financière. Consulter la
                  - link "F.A.Q" [ref=f32e330] [cursor=pointer]:
                    - /url: faq.php
                  - text: pour plus d'informations Les informations de « Quota » sont renvoyées dans les données utilisateurs afin que celui-ci soit facilement intégrable et géré directement par le logiciel de scrape. Cette gestion de « Quota » par logiciel est désormais obligatoire afin de ne pas saturer nos serveurs pour rien.

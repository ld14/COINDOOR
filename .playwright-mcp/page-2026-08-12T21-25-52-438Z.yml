                        - table [ref=f27e392]:
                          - rowgroup [ref=f27e393]:
                            - row [ref=f27e394]:
                              - cell [ref=f27e395]:
                                - iframe [ref=f27e397]:
                                  - generic [ref=f30e1]:
                                    - generic [ref=f30e2]: Hello,
                                    - generic [ref=f30e6]: I'd like to introduce the software I'm building and ask for developer credentials for the API.
                                    - generic [ref=f30e10]: "GameAlfa is a self-hosted web application for cataloguing physical video game collections, boxed cartridges and discs sitting on a shelf. For every copy they own, users record the specific regional edition, its condition and completeness, what came in the box, and their own photographs of the actual item. Around that there is a small community layer: collectors follow each other, comment on games, keep a public profile of their shelf, and maintain topic pages about specific systems or series."
                                    - generic [ref=f30e14]: It is non-commercial. No advertising, no paid tiers, no resale or redistribution of third-party data. It runs on a single self-hosted server (NestJS + PostgreSQL) and is used by a small community of collectors.
                                    - generic [ref=f30e19]: "It has nothing to do with ROMs, I want to be explicit about this, because I understand it is the main concern around API access. GameAlfa has no connection to emulation. It does not store, index, scan, distribute or link to ROM files, and there is no ROM-scanning workflow in it, nothing in the application reads a directory of dumps. The unit of data is a physical edition: country of release, region, product code (SLES-xxxxx, WUP-xxx…), barcode, publisher, year of release."
                                    - generic [ref=f30e23]: Why I'm asking for ScreenScraper?
                                    - generic [ref=f30e26]: "The catalogue is currently built from IGDB (about 31,000 games and 78,000 editions) and enriched from MobyGames. Both are weak on the two things that matter most for physical European collections:"
                                    - generic [ref=f30e30]: 1. Regional titles, the name actually printed on the PAL box. Out of ~31,000 games we currently have an Italian title for only 428 of them. A collector in Italy searching for "Il potere della Forza" does not find their own copy.
                                    - generic [ref=f30e33]: 2. Region-specific release data for European editions.
                                    - generic [ref=f30e36]: From what I can see, ScreenScraper is the best free source for per-region names of European releases, which is exactly the gap I cannot close with the sources I already use.
                                    - generic [ref=f30e40]: "How I would use the API:"
                                    - generic [ref=f30e43]:
                                      - generic [ref=f30e44]: jeuRecherche.php
                                      - generic [ref=f30e46]: with
                                      - generic [ref=f30e48]: recherche
                                      - generic [ref=f30e50]: (title) +
                                      - generic [ref=f30e52]: systemeid
                                      - generic [ref=f30e54]: ", to match one of our games to its ScreenScraper entry. The search is always restricted to a single system."
                                    - generic [ref=f30e56]:
                                      - generic [ref=f30e57]: jeuInfos.php
                                      - generic [ref=f30e59]: on the matched game, to read its regional names.
                                    - generic [ref=f30e62]:
                                      - generic [ref=f30e63]: No CRC / MD5 / SHA1 lookups. I have no ROM files, so the checksum path, the one your documentation shows as the normal way to scrape,
                                      - generic [ref=f30e65]: "simply does not apply to my case. I am aware this makes matching harder on my side, and I have already implemented a conservative matching policy: normalised title comparison, mandatory system match, a required margin over the runner-up candidate, and a release-year check. When the result is ambiguous, my code imports nothing rather than guessing."
                                    - generic [ref=f30e67]: Volumes are low and bursty rather than continuous. Enrichment runs only for games that a user actually owns or has opened, never as a bulk sweep of the whole catalogue. Every response is stored in our database and never requested a second time.
                                    - generic [ref=f30e73]: "What I'm happy to commit to:"
                                    - generic [ref=f30e76]: "- one request at a time (a single thread), with a configurable rate limit"
                                    - generic [ref=f30e79]: "- permanent local caching, so any given game is looked up exactly once"
                                    - generic [ref=f30e82]: "- visible attribution to ScreenScraper on every field that comes from you, with a link back to the corresponding page"
                                    - generic [ref=f30e85]: "-throttling or stopping entirely on request."
                                    - generic [ref=f30e89]: Thank you for your time, and for the work you put into the database.

                        - text: "Paramètres d'entrées : devid : votre identifiant développeur devpassword : votre mot de passe développeur softname : nom du logiciel appelant output : xml(par defaut),json ssid(non obligatoire) : identifiant ScreenScraper de l'utilisateur sspassword(non obligatoire) : Mot de passe ScreenScraper de l'utilisateur crc* : calcul crc du fichier rom/iso/dossier existant en local md5* : calcul md5 du fichier rom/iso/dossier existant en local sha1* : calcul sha1 du fichier rom/iso/dossier existant en local systemeid : identifiant numérique du système (voir systemesListe.php) romtype : Type de \"rom\" : fichier rom unique / fichier iso unique / dossier romnom : nom du fichier (avec extension) ou nom du dossier romtaille* : Taille en octet du fichier ou du dossier serialnum : Forcer la recherche du jeu avec le numero de série de la rom (iso) associé gameid** : Forcer la recherche du jeu avec son identifiant numérique * a moins d'une dérogation, vous devez envoyer au moins un (le mieux serait les 3) de ces calculs (crc,md5,sha1) d'identification de fichier rom/iso ou dossier avec votre requete ET la taille (on octect du fichier ou du dossier). ** Aucune information sur la rom n'est envoyée dans ce cas."
